spring:
  application:
    name: gym-socios-api

  datasource:
    url: jdbc:mysql://localhost:3306/db_gym_socios
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081